        /* animate only the single hero scene, once */
        .mask-in { animation: maskIn .9s ease-out .2s both; }

        @media (prefers-reduced-motion: reduce) {

                        <g fill="#4B7099">

                            <polygon points="184,268 200,264 216,268 217,282 214,294 226,300 230,312 228,364 217,366 216,402 186,402 184,366 172,364 170,312 174,300 186,294 183,282" fill="#22C55E" fill-opacity=".42" stroke="#4ADE80"/>
                            <polygon points="458,320 470,314 482,320 483,330 490,334 492,344 490,382 481,384 480,414 460,414 459,384 450,382 448,344 450,334 457,330" fill="#22C55E" fill-opacity=".42" stroke="#4ADE80"/>

    <!-- ===== STATS ===== -->

                <div class="text-sm text-slate-500 mt-1">mAP50 (Mask)</div>

            <div class="px-6 py-8 text-center">
                <div class="text-3xl md:text-4xl font-bold">771</div>
                <div data-i18n="stat_val" class="text-sm text-slate-500 mt-1"></div>
            </div>
            <div class="px-6 py-8 text-center border-l md:border-l-0 border-line">
                <div class="text-3xl md:text-4xl font-bold">6.3<span class="text-lg font-semibold ml-0.5">MB</span></div>

    <!-- ===== FEATURES ===== -->
    <section id="features" class="py-20 md:py-28 px-4 sm:px-6 lg:px-8 scroll-mt-16">
        <div class="max-w-7xl mx-auto grid lg:grid-cols-12 gap-10 lg:gap-16">
            <div class="lg:col-span-5">
                <h2 data-i18n="feat_title" class="text-2xl md:text-4xl font-bold"></h2>
                <p data-i18n="feat_desc" class="mt-4 text-slate-600 text-base md:text-lg leading-relaxed"></p>
            </div>
            <div class="lg:col-span-7 divide-y divide-line border-y border-line">
                <div class="flex gap-5 py-7">

                    </div>
                    <div>
                        <h3 data-i18n="f1_title" class="text-lg font-semibold"></h3>

                    </div>
                </div>
                <div class="flex gap-5 py-7">
                    <div class="shrink-0 w-11 h-11 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    </div>
                    <div>
                        <h3 data-i18n="f2_title" class="text-lg font-semibold"></h3>
                        <p data-i18n="f2_desc" class="mt-1.5 text-slate-600 leading-relaxed"></p>
                    </div>
                </div>
                <div class="flex gap-5 py-7">
                    <div class="shrink-0 w-11 h-11 rounded-xl bg-brand-50 text-brand-600 flex items-center justify-center">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    </div>
                    <div>
                        <h3 data-i18n="f3_title" class="text-lg font-semibold"></h3>
                        <p data-i18n="f3_desc" class="mt-1.5 text-slate-600 leading-relaxed"></p>
                    </div>
                </div>
            </div>

    <!-- ===== TRY IT ===== -->
    <section id="try" class="py-20 md:py-28 px-4 sm:px-6 lg:px-8 bg-white border-y border-line scroll-mt-16">
        <div class="max-w-5xl mx-auto">
            <div class="max-w-2xl mb-10">
                <h2 data-i18n="try_title" class="text-2xl md:text-4xl font-bold"></h2>
                <p data-i18n="try_desc" class="mt-4 text-slate-600 text-base md:text-lg"></p>
            </div>

            <div class="rounded-2xl border border-line bg-paper p-4 sm:p-6 md:p-8">
                <!-- Upload zone -->
                <div id="dropZone" role="button" tabindex="0"
                     class="upload-zone border-2 border-dashed border-slate-300 bg-white rounded-xl p-8 md:p-14 text-center cursor-pointer hover:border-brand-400 focus-visible:outline focus-visible:outline-2 focus-visible:outline-brand-500">
                    <div class="w-14 h-14 mx-auto mb-4 rounded-xl bg-brand-50 flex items-center justify-center">
                        <svg class="w-7 h-7 text-brand-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                        </svg>
                    </div>
                    <p data-i18n="drop_title" class="text-base md:text-lg font-medium text-slate-800"></p>
                    <p data-i18n="drop_hint" class="text-sm text-slate-500 mt-1"></p>
                    <input type="file" id="fileInput" accept="image/*" class="hidden">
                </div>

                <!-- Controls -->
                <div class="mt-6 flex flex-col sm:flex-row sm:items-end gap-5 sm:gap-8">
                    <div class="flex-1 w-full">
                        <label for="confSlider" class="flex items-center justify-between text-sm font-medium text-slate-700 mb-2">
                            <span data-i18n="conf_label"></span>
                            <span id="confValue" class="text-brand-700 font-bold">0.25</span>
                        </label>
                        <input type="range" id="confSlider" min="0.05" max="0.95" step="0.05" value="0.25"
                               class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-600">
                    </div>
                    <button id="predictBtn" type="button" disabled
                            class="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-3 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
                        <span id="predictSpinner" class="hidden w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                        <span id="predictLabel"></span>
                    </button>
                </div>

                <!-- Error -->
                <div id="errorBox" role="alert" class="hidden mt-6 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

                <!-- Preview + Result -->
                <div id="resultArea" class="hidden mt-8">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <div class="flex items-center justify-between gap-3 mb-3">
                                <h3 data-i18n="res_original" class="font-semibold text-slate-700"></h3>
                                <span id="fileName" class="text-xs text-slate-400 truncate max-w-[55%]"></span>
                            </div>
                            <img id="previewImg" class="w-full rounded-xl border border-line bg-white" alt="preview">
                        </div>
                        <div>
                            <div class="flex items-center justify-between gap-3 mb-3">
                                <h3 data-i18n="res_result" class="font-semibold text-slate-700"></h3>
                                <span id="detectCount" class="hidden px-2.5 py-1 bg-brand-50 text-brand-700 text-xs font-medium rounded-full"></span>
                            </div>
                            <div class="relative rounded-xl border border-line bg-white overflow-hidden min-h-[160px]">
                                <img id="resultImg" class="hidden w-full" alt="result">
                                <div id="resultPlaceholder" data-i18n="res_placeholder" class="absolute inset-0 flex items-center justify-center p-6 text-center text-sm text-slate-400"></div>
                                <div id="loading" class="hidden absolute inset-0 bg-white/85 flex flex-col items-center justify-center gap-3">
                                    <div class="w-10 h-10 border-4 border-brand-100 border-t-brand-600 rounded-full animate-spin"></div>
                                    <p data-i18n="loading" class="text-sm text-slate-600"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Detections table -->
                    <div id="detectionsWrap" class="hidden mt-8">
                        <h3 data-i18n="det_title" class="font-semibold text-slate-700 mb-3"></h3>
                        <div class="overflow-x-auto rounded-xl border border-line bg-white">
                            <table class="w-full text-sm">
                                <thead class="bg-slate-50 text-slate-500">
                                    <tr>
                                        <th class="px-4 py-3 text-left font-medium">#</th>
                                        <th data-i18n="th_class" class="px-4 py-3 text-left font-medium"></th>
                                        <th data-i18n="th_conf" class="px-4 py-3 text-left font-medium"></th>
                                        <th data-i18n="th_bbox" class="px-4 py-3 text-left font-medium whitespace-nowrap"></th>
                                    </tr>
                                </thead>
                                <tbody id="detectionsBody" class="divide-y divide-line"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== ABOUT ===== -->

        <div class="max-w-7xl mx-auto grid lg:grid-cols-2 gap-12 lg:gap-16 items-start">
            <div>

                <dl class="mt-8 divide-y divide-line border-y border-line">

                        <div data-i18n="ab_train_n" class="text-xl font-bold text-brand-700 whitespace-nowrap"></div>
                    </div>
                    <div class="flex items-center justify-between gap-4 py-5">
                        <div>
                            <dt data-i18n="ab_val" class="font-semibold"></dt>
                            <dd data-i18n="ab_val_d" class="text-sm text-slate-500 mt-0.5"></dd>
                        </div>
                        <div data-i18n="ab_val_n" class="text-xl font-bold text-brand-700 whitespace-nowrap"></div>
                    </div>
                    <div class="flex items-center justify-between gap-4 py-5">
                        <div>
                            <dt class="font-semibold">mAP50 (Mask)</dt>
                            <dd class="text-sm text-slate-500 mt-0.5">mAP50-95 0.401, Precision 0.736</dd>
                        </div>
                        <div class="text-xl font-bold text-brand-700">0.659</div>
                    </div>
                </dl>
            </div>

            <div class="bg-white rounded-2xl p-6 md:p-8 border border-line">
                <h3 data-i18n="perf_title" class="font-semibold text-lg mb-6"></h3>
                <div class="space-y-5">
                    <div>
                        <div class="flex justify-between text-sm mb-1.5">
                            <span data-i18n="cls_person" class="font-medium"></span>
                            <span class="text-slate-500">mAP50 0.688</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-cls-person h-2.5 rounded-full" style="width: 69%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1.5">
                            <span data-i18n="cls_car" class="font-medium"></span>
                            <span class="text-slate-500">mAP50 0.592</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-cls-car h-2.5 rounded-full" style="width: 59%"></div></div>
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1.5">
                            <span data-i18n="cls_bus" class="font-medium"></span>
                            <span class="text-slate-500">mAP50 0.725</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-2.5"><div class="bg-cls-bus h-2.5 rounded-full" style="width: 73%"></div></div>
                    </div>
                </div>
                <div class="mt-8 pt-6 border-t border-line grid grid-cols-2 gap-4 text-center">
                    <div>
                        <div class="text-2xl font-bold text-brand-700">0.818</div>
                        <div class="text-xs text-slate-500 mt-0.5">Box Precision</div>
                    </div>
                    <div>
                        <div class="text-2xl font-bold text-brand-700">0.557</div>
                        <div class="text-xs text-slate-500 mt-0.5">Box Recall</div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-white border-t border-line py-10 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
            <div class="flex items-center gap-2.5">
                <span class="w-7 h-7 rounded-lg bg-ink flex items-center justify-center">
                    <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 15l4-9 7 3 5 7-7 4z"/></svg>
                </span>
                <span class="font-bold">PolyDetect</span>
            </div>
            <p data-i18n="footer_built" class="text-sm text-slate-500"></p>
            <p data-i18n="footer_proj" class="text-sm text-slate-400"></p>
        </div>
    </footer>

    <!-- ===== SCRIPTS ===== -->
    <script>
        // ---------- i18n ----------
        const I18N = {
            th: {
                title: 'PolyDetect: ตรวจจับคน รถยนต์ และรถบัสด้วย Segmentation',
                nav_features: 'คุณสมบัติ', nav_about: 'เกี่ยวกับโมเดล', nav_cta: 'ลองใช้งาน',
                hero_title: 'แยกคน รถยนต์ และรถบัสออกจากภาพ ตามขอบจริงทีละพิกเซล',
                hero_desc: 'อัปโหลดรูปภาพ แล้วโมเดลจะวาดมาสก์ครอบวัตถุแต่ละชิ้นตามรูปร่างจริง ไม่ใช่แค่กรอบสี่เหลี่ยม ใช้งานได้ทันทีบนเบราว์เซอร์',
                hero_cta: 'ลองใช้งานเลย', hero_cta2: 'ดูคุณสมบัติ',
                hero_note: 'ใช้โมเดล YOLOv8n-seg ทำงานบน CPU ได้ ไม่ต้องมี GPU',
                scene_caption: 'ภาพประกอบผลการแบ่งส่วนวัตถุ',
                cls_person: 'คน', cls_car: 'รถยนต์', cls_bus: 'รถบัส',
                stat_classes: 'คลาสวัตถุ', stat_val: 'วัตถุในชุดตรวจสอบ', stat_size: 'ขนาดโมเดล',
                feat_title: 'ทำไมต้องใช้ PolyDetect',
                feat_desc: 'โมเดลเทรนใหม่ทั้งหมดบน COCO 2017 โดยไม่ได้ใช้ข้อมูลชุดเดิม',
                f1_title: 'แม่นยำระดับพิกเซล',
                f1_desc: 'วาดมาสก์ตามขอบของวัตถุจริง ไม่ใช่แค่กรอบสี่เหลี่ยม จึงเห็นรูปร่างของคน รถยนต์ และรถบัสได้ชัดเจน',
                f2_title: 'เบาและเร็ว',
                f2_desc: 'โมเดลขนาด 6.3MB ประมวลผลบน CPU ได้ประมาณ 9 มิลลิวินาทีต่อภาพ ไม่จำเป็นต้องมี GPU',
                f3_title: 'ข้อมูลจริงจาก COCO',
                f3_desc: 'เทรนด้วยภาพ COCO 2017 จำนวน 583 ภาพ เฉพาะ person, car และ bus โดยทุกคลาสมีอย่างน้อย 100 วัตถุ',
                try_title: 'ลองใช้งาน',
                try_desc: 'อัปโหลดรูปภาพ (JPG, PNG, WEBP) แล้วกดตรวจจับวัตถุ',
                drop_title: 'ลากรูปมาวางที่นี่ หรือกดเพื่อเลือกไฟล์',
                drop_hint: 'รองรับ JPG, PNG, WEBP',
                conf_label: 'ค่าความมั่นใจขั้นต่ำ',
                btn_predict: 'ตรวจจับวัตถุ', btn_loading: 'กำลังตรวจจับ...',
                res_original: 'รูปต้นฉบับ', res_result: 'ผลลัพธ์',
                res_placeholder: 'ผลลัพธ์จะแสดงที่นี่หลังกดตรวจจับวัตถุ',
                loading: 'กำลังประมวลผล...',
                objects: 'วัตถุ',
                det_title: 'รายการที่ตรวจพบ',
                th_class: 'คลาส', th_conf: 'ความมั่นใจ', th_bbox: 'ตำแหน่งกรอบ (x1, y1, x2, y2)',
                det_empty: 'ไม่พบวัตถุ ลองลดค่าความมั่นใจขั้นต่ำแล้วตรวจจับอีกครั้ง',
                err_prefix: 'เกิดข้อผิดพลาด: ',
                about_title: 'เกี่ยวกับโมเดล',
                about_desc: 'PolyDetect ใช้ YOLOv8n-seg ที่เทรนบนชุดข้อมูล COCO 2017 ใหม่ทั้งหมด โดยเลือกเฉพาะภาพที่มี person, car และ bus มา fine-tune',
                ab_train: 'ชุดฝึก (Train)', ab_train_d: 'คน 1,730, รถยนต์ 395, รถบัส 193 วัตถุ', ab_train_n: '583 ภาพ',
                ab_val: 'ชุดตรวจสอบ (Val)', ab_val_d: 'คน 604, รถยนต์ 108, รถบัส 59 วัตถุ', ab_val_n: '194 ภาพ',
                perf_title: 'ประสิทธิภาพแยกตามคลาส',
                footer_built: 'สร้างด้วย YOLOv8n-seg, FastAPI และ Tailwind CSS',
                footer_proj: 'โปรเจกต์ ML Lab 2026',
            },
            en: {
                title: 'PolyDetect: Person, Car and Bus Segmentation',
                nav_features: 'Features', nav_about: 'About the model', nav_cta: 'Try it',
                hero_title: 'Pick out people, cars and buses from any photo, pixel by pixel',
                hero_desc: 'Upload an image and the model draws a mask around each object along its real outline, not just a bounding box. Runs right in your browser.',
                hero_cta: 'Try it now', hero_cta2: 'See features',
                hero_note: 'Powered by YOLOv8n-seg. Runs on CPU, no GPU needed.',
                scene_caption: 'Illustration of segmentation output',
                cls_person: 'Person', cls_car: 'Car', cls_bus: 'Bus',
                stat_classes: 'Classes', stat_val: 'Validation instances', stat_size: 'Model size',
                feat_title: 'Why PolyDetect',
                feat_desc: 'A model trained from scratch on COCO 2017, without reusing the earlier dataset.',
                f1_title: 'Pixel-level accuracy',
                f1_desc: 'Masks follow the real edges of each object instead of a box, so the shape of every person, car and bus stays clear.',
                f2_title: 'Light and fast',
                f2_desc: 'The 6.3MB model runs inference on CPU in about 9 ms per image. No GPU required.',
                f3_title: 'Real data from COCO',
                f3_desc: 'Trained on 583 COCO 2017 images covering person, car and bus only, with at least 100 objects in every class.',
                try_title: 'Try it out',
                try_desc: 'Upload an image (JPG, PNG, WEBP) and run detection.',
                drop_title: 'Drag an image here or click to choose a file',
                drop_hint: 'Supports JPG, PNG, WEBP',
                conf_label: 'Confidence threshold',
                btn_predict: 'Detect objects', btn_loading: 'Detecting...',
                res_original: 'Original', res_result: 'Result',
                res_placeholder: 'The result appears here after you run detection',
                loading: 'Processing...',
                objects: 'objects',
                det_title: 'Detections',
                th_class: 'Class', th_conf: 'Confidence', th_bbox: 'Bounding box (x1, y1, x2, y2)',
                det_empty: 'No objects found. Try lowering the confidence threshold and run again.',
                err_prefix: 'Something went wrong: ',
                about_title: 'About the model',
                about_desc: 'PolyDetect uses YOLOv8n-seg trained from scratch on COCO 2017, fine-tuned only on images that contain person, car and bus.',
                ab_train: 'Training set', ab_train_d: 'Person 1,730, car 395, bus 193 objects', ab_train_n: '583 images',
                ab_val: 'Validation set', ab_val_d: 'Person 604, car 108, bus 59 objects', ab_val_n: '194 images',
                perf_title: 'Performance per class',
                footer_built: 'Built with YOLOv8n-seg, FastAPI and Tailwind CSS',
                footer_proj: 'ML Lab Project 2026',
            },
        };

        let lang = 'th';
        try {
            const saved = localStorage.getItem('polydetect-lang');
            if (saved === 'th' || saved === 'en') lang = saved;
        } catch (e) {}

        const t = (k) => (I18N[lang] && I18N[lang][k]) || I18N.th[k] || k;

        // ---------- elements & state ----------
        const confSlider = document.getElementById('confSlider');
        const confValue = document.getElementById('confValue');
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const predictBtn = document.getElementById('predictBtn');
        const predictLabel = document.getElementById('predictLabel');
        const predictSpinner = document.getElementById('predictSpinner');
        const errorBox = document.getElementById('errorBox');
        const resultImg = document.getElementById('resultImg');
        const resultPlaceholder = document.getElementById('resultPlaceholder');
        const detectCount = document.getElementById('detectCount');
        const detectionsWrap = document.getElementById('detectionsWrap');
        const detectionsBody = document.getElementById('detectionsBody');

        let selectedFile = null;
        let isLoading = false;
        let lastData = null;   // last prediction response
        let lastError = null;  // { raw: string } or { exc: string }

        const CLS = {
            person: { key: 'cls_person', badge: 'bg-green-50 text-green-700', dot: 'bg-cls-person' },
            car:    { key: 'cls_car',    badge: 'bg-amber-50 text-amber-700', dot: 'bg-cls-car' },
            bus:    { key: 'cls_bus',    badge: 'bg-red-50 text-red-700',     dot: 'bg-cls-bus' },
        };

        // ---------- render helpers ----------
        function renderPredictBtn() {
            predictLabel.textContent = isLoading ? t('btn_loading') : t('btn_predict');
            predictSpinner.classList.toggle('hidden', !isLoading);
        }

        function renderError() {
            if (!lastError) { errorBox.classList.add('hidden'); errorBox.textContent = ''; return; }
            errorBox.textContent = lastError.exc ? t('err_prefix') + lastError.exc : lastError.raw;
            errorBox.classList.remove('hidden');
        }

        function renderResults() {
            if (!lastData) {
                resultImg.classList.add('hidden');
                resultImg.removeAttribute('src');
                resultPlaceholder.classList.remove('hidden');
                detectCount.classList.add('hidden');
                detectionsWrap.classList.add('hidden');
                detectionsBody.innerHTML = '';
                return;
            }
            resultImg.src = lastData.image;
            resultImg.classList.remove('hidden');
            resultPlaceholder.classList.add('hidden');
            detectCount.textContent = `${lastData.count} ${t('objects')}`;
            detectCount.classList.remove('hidden');
            detectionsWrap.classList.remove('hidden');

            if (!lastData.detections || lastData.detections.length === 0) {
                detectionsBody.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-slate-500">${t('det_empty')}</td></tr>`;
                return;
            }
            detectionsBody.innerHTML = lastData.detections.map((d, i) => {
                const c = CLS[d.class] || { key: null, badge: 'bg-slate-100 text-slate-700', dot: 'bg-slate-400' };
                const name = c.key ? t(c.key) : d.class;
                return `
                    <tr class="hover:bg-slate-50">
                        <td class="px-4 py-3 text-slate-400">${i + 1}</td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium ${c.badge}">
                                <span class="w-2 h-2 rounded-full ${c.dot}"></span>${name}
                            </span>
                        </td>
                        <td class="px-4 py-3 font-medium text-slate-700">${(d.confidence * 100).toFixed(1)}%</td>
                        <td class="px-4 py-3 text-slate-500 text-xs whitespace-nowrap">${d.bbox.join(', ')}</td>
                    </tr>`;
            }).join('');
        }

        function applyLang() {
            document.documentElement.lang = lang;
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
            document.querySelectorAll('[data-lang]').forEach((b) => {
                b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
            });
            renderPredictBtn();
            renderError();
            renderResults();
        }

        function setLang(l) {
            lang = l;
            try { localStorage.setItem('polydetect-lang', l); } catch (e) {}
            applyLang();
        }

        document.querySelectorAll('[data-lang]').forEach((b) => {
            b.addEventListener('click', () => setLang(b.dataset.lang));
        });

        // ---------- mobile menu ----------
        const menuBtn = document.getElementById('mobileMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            const open = mobileMenu.classList.toggle('hidden') === false;
            menuBtn.setAttribute('aria-expanded', String(open));
        });
        document.querySelectorAll('.mobile-link').forEach((a) => {
            a.addEventListener('click', () => {
                mobileMenu.classList.add('hidden');
                menuBtn.setAttribute('aria-expanded', 'false');
            });
        });

        // ---------- slider ----------
        confSlider.addEventListener('input', () => { confValue.textContent = confSlider.value; });

        // ---------- upload ----------
        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
        });
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                selectedFile = file;
                showPreview(file);
            }
        });
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) {
                selectedFile = file;
                showPreview(file);
            }
        });

        function showPreview(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('previewImg').src = e.target.result;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('resultArea').classList.remove('hidden');
                document.getElementById('loading').classList.add('hidden');
                lastData = null;
                lastError = null;
                renderResults();
                renderError();
                predictBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }

        // ---------- predict ----------
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile || isLoading) return;
            isLoading = true;
            lastError = null;
            renderError();
            renderPredictBtn();
            predictBtn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('conf', confSlider.value);

            try {
                const res = await fetch('/predict', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.error) {
                    lastError = { raw: data.error };
                    lastData = null;
                } else {
                    lastData = data;
                }
            } catch (err) {
                lastError = { exc: err.message };
                lastData = null;
            } finally {
                isLoading = false;
                document.getElementById('loading').classList.add('hidden');
                predictBtn.disabled = false;
                renderPredictBtn();
                renderError();
                renderResults();
            }
        });

        // init
        applyLang();
    </script>
</body>
</html>
