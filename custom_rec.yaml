path: ./dataset/coco_rec

train: images/train
val: images/val
test: images/val

nc: 3

names:
  0: person
  1: car
  2: bus

# Hyperparameters
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.2
translate: 0.1
scale: 0.75
shear: 0.0
perspective: 0.001
flipud: 0.0
fliplr: 0.5
bgr: 0.0
mosaic: 1.0
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
copy_paste_mode: mixup
auto_augment: randaugment
erasing: 0.4
