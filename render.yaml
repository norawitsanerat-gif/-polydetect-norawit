services:
  - type: web
    name: polydetect
    runtime: python
    buildCommand: pip install -r requirements.txt && pip uninstall -y opencv-python && pip install opencv-python-headless==4.10.0.84
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: KMP_DUPLICATE_LIB_OK
        value: "TRUE"
    healthCheckPath: /health
    autoDeploy: true
